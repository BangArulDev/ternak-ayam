<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Login - AyamPintar Mobile</title>

    <!-- CSS Bundled via Webpack -->

    <style>
      :root {
        --primary-gradient: linear-gradient(
          135deg,
          #059669 0%,
          #10b981 100%
        ); /* Hijau Segar */
        --bg-light: #f3f4f6;
        --card-bg: #ffffff;
        --text-main: #1f2937;
      }

      body {
        font-family: "Poppins", sans-serif;
        background-color: var(--bg-light);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
      }

      /* HEADER MOBILE - Melengkung seperti Aplikasi */
      .mobile-header {
        background: var(--primary-gradient);
        height: 280px;
        width: 100%;
        border-bottom-left-radius: 40px;
        border-bottom-right-radius: 40px;
        padding: 40px 20px;
        color: white;
        text-align: center;
        position: relative;
        z-index: 1;
      }

      .app-logo {
        background: rgba(255, 255, 255, 0.2);
        width: 80px;
        height: 80px;
        border-radius: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 15px;
        backdrop-filter: blur(5px);
      }

      .app-logo i {
        font-size: 40px;
        color: white;
      }

      .welcome-text h2 {
        font-weight: 700;
        font-size: 1.5rem;
        margin-bottom: 5px;
      }

      .welcome-text p {
        font-size: 0.9rem;
        opacity: 0.9;
        font-weight: 300;
      }

      /* CARD FORM - Floating Effect */
      .login-card-wrapper {
        padding: 0 20px;
        margin-top: -60px; /* Menarik kartu ke atas header */
        position: relative;
        z-index: 2;
        flex-grow: 1;
      }

      .login-card {
        background: var(--card-bg);
        border-radius: 24px;
        padding: 30px 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      /* INPUT STYLING - Besar & Mudah Diketik */
      .custom-input-group {
        background-color: #f9fafb;
        border: 2px solid #e5e7eb;
        border-radius: 16px;
        padding: 8px 15px;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }

      .custom-input-group:focus-within {
        border-color: #10b981;
        background-color: #fff;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
      }

      .custom-input-group i {
        color: #9ca3af;
        font-size: 1.1rem;
        margin-right: 10px;
      }

      .custom-input-group input {
        border: none;
        background: transparent;
        width: 100%;
        outline: none;
        color: var(--text-main);
        font-weight: 500;
        font-size: 1rem;
        padding: 10px 0;
      }

      .custom-input-group input::placeholder {
        color: #9ca3af;
        font-weight: 400;
      }

      /* TOMBOL BESAR - Thumb Friendly */
      .btn-masuk {
        background: var(--primary-gradient);
        border: none;
        border-radius: 16px;
        width: 100%;
        padding: 18px;
        font-size: 1.1rem;
        font-weight: 700;
        color: white;
        box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        transition: transform 0.2s;
      }

      .btn-masuk:active {
        transform: scale(0.98);
      }

      .alert-mobile {
        border-radius: 12px;
        font-size: 0.85rem;
        margin-bottom: 20px;
        border: none;
        background-color: #fef2f2;
        color: #dc2626;
      }

      .footer-link {
        text-align: center;
        margin-top: 30px;
        padding-bottom: 20px;
        font-size: 0.85rem;
        color: #6b7280;
      }

      /* Animasi Masuk */
      .fade-in-up {
        animation: fadeInUp 0.6s ease-out forwards;
        opacity: 0;
        transform: translateY(20px);
      }

      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="mobile-header">
      <div class="app-logo">
        <i class="fas fa-kiwi-bird"></i>
      </div>
      <div class="welcome-text">
        <h2>AyamPintar</h2>
        <p>Pantau kandang dari genggaman Anda</p>
      </div>
    </div>

    <div class="login-card-wrapper fade-in-up">
      <div class="login-card">
        <div class="mb-4 text-center">
          <h5 style="font-weight: 600; color: #374151">Silakan Masuk</h5>
        </div>

        <div
          id="error-alert"
          class="alert alert-mobile p-3 d-flex align-items-center d-none"
        >
          <i class="fas fa-exclamation-triangle me-2"></i>
          <div id="error-message"></div>
        </div>

        <form id="loginForm">
          <div class="custom-input-group">
            <i class="fas fa-user"></i>
            <input
              type="text"
              name="username"
              id="username"
              placeholder="Username"
              required
              autocomplete="off"
            />
          </div>

          <div class="custom-input-group">
            <i class="fas fa-lock"></i>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Password"
              required
            />
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" />
              <label class="form-check-label text-muted small" for="remember"
                >Ingat Saya</label
              >
            </div>
          </div>

          <button type="submit" class="btn-masuk">
            MASUK SEKARANG <i class="fas fa-arrow-right ms-2"></i>
          </button>
        </form>
      </div>

      <div class="footer-link">
        <p>
          Butuh bantuan?
          <a
            target="_blank"
            href="https://api.whatsapp.com/send/?phone=%2B6288290483433&text&type=phone_number&app_absent=0"
            class="text-success fw-bold text-decoration-none"
            >Hubungi Admin</a
          >
        </p>
        <small class="text-muted opacity-50">Versi Mobile v1.0</small>
      </div>
    </div>
  </body>
</html>
